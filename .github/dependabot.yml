# Les PR Dependabot (hors montée majeure) sont fusionnées automatiquement par ci.yml
# une fois la vérification passée, puis publiées par la release quotidienne.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # La plateforme Quarkus est mise à jour par auto-update.yml (quarkus:update + OpenRewrite).
      - dependency-name: "io.quarkus.platform:*"
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
