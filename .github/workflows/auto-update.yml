# Mise à jour automatique de la plateforme Quarkus (quarkus:update + recettes OpenRewrite).
# update → vérification (tests + architecture) dans le même job → merge → release.
# Si la vérification échoue, la PR reste ouverte pour une intervention manuelle.
# Les autres dépendances sont mises à jour par Dependabot (voir ci.yml pour l'auto-merge).
name: Auto Update

on:
  schedule:
    - cron: "0 12 * * 6" # tous les samedis à midi (UTC)
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: auto-update/quarkus

jobs:
  update:
    name: Quarkus update & verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    outputs:
      verified: ${{ steps.verify.outcome == 'success' && steps.pr.outputs.number != '' }}
      sha: ${{ steps.commit.outputs.sha }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0 # git-commit-id-maven-plugin (git describe)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Update Quarkus
        run: ./mvnw -B -ntp quarkus:update -Drewrite=true

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Quarkus est déjà à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "deps: update Quarkus platform (quarkus:update + OpenRewrite)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat HEAD

      # Mêmes vérifications que verify.yml, exécutées sur le code généré dans ce job
      # (aucune ref externe n'est checkoutée).
      - name: Verify (build, tests, architecture)
        id: verify
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          ./mvnw -B -ntp verify
          docker build -f src/main/docker/Dockerfile.jvm -t krabotnotif:verify .

      - name: Push branch and open or reuse pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin "$BRANCH"
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            URL=$(gh pr create --base master --head "$BRANCH" \
              --title "deps: update Quarkus platform" \
              --body "Mise à jour automatique (\`quarkus:update\` + OpenRewrite). Fusionnée automatiquement si la vérification passe." \
              --label dependencies --label automated-pr)
            NUMBER=${URL##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Report verification failure
        if: steps.commit.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --body "❌ La vérification a échoué ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) : intervention manuelle nécessaire."
          exit 1

  merge:
    name: Merge
    needs: update
    if: needs.update.outputs.verified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ needs.update.outputs.pr }}" --repo "${{ github.repository }}" \
            --squash --delete-branch --match-head-commit "${{ needs.update.outputs.sha }}"

  release:
    needs: merge
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      security-events: write
      actions: read
    secrets: inherit
