# Mise à jour automatique de la plateforme Quarkus (quarkus:update + recettes OpenRewrite).
# update → verify (tests + architecture) → merge → release.
# Si la vérification échoue, la PR reste ouverte pour une intervention manuelle.
# Les autres dépendances sont mises à jour par Dependabot (voir ci.yml pour l'auto-merge).
name: Auto Update

on:
  schedule:
    - cron: "0 12 * * 6" # tous les samedis à midi (UTC)
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: auto-update/quarkus

jobs:
  update:
    name: Quarkus update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Update Quarkus
        run: ./mvnw -B -ntp quarkus:update -Drewrite=true

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Quarkus est déjà à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "deps: update Quarkus platform (quarkus:update + OpenRewrite)"
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat HEAD

      - name: Open or reuse pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            URL=$(gh pr create --base master --head "$BRANCH" \
              --title "deps: update Quarkus platform" \
              --body "Mise à jour automatique (\`quarkus:update\` + OpenRewrite). Fusionnée automatiquement si la vérification passe." \
              --label dependencies --label automated-pr)
            NUMBER=${URL##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  merge:
    name: Merge
    needs: [update, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ needs.update.outputs.pr }}" --repo "${{ github.repository }}" \
            --squash --delete-branch --match-head-commit "${{ needs.update.outputs.sha }}"

  report-failure:
    name: Report failure
    needs: [update, verify]
    if: failure() && needs.update.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ needs.update.outputs.pr }}" --repo "${{ github.repository }}" \
            --body "❌ La vérification a échoué ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) : intervention manuelle nécessaire."

  release:
    needs: merge
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      security-events: write
      actions: read
    secrets: inherit
